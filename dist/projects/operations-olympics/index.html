<!doctype html>
<html lang="zh-CN" style="--bg: #dcebf7; --fg: #253c58; --muted: #435e7b; --accent: #335f96">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#dcebf7">
  <meta name="description" content="结合巴黎奥运会，为夏日清凉商品制作系列海报和动效。让雕塑与地标从原有材质变成冰。大卫、卢浮宫等八个画面沿用同一套海报版式。">
  <title>中国凉方 · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>中国凉方</h1>
      <p>巴黎奥运会营销 · 2024</p>
    </header>
    <section id="motion" class="case-media case-motion" aria-label="项目动态">
      <div class="motion-controls">
        <div class="motion-picker" role="group" aria-label="选择动态">
          <button type="button" aria-pressed="true" aria-controls="motion-1">大卫</button>
          <button type="button" aria-pressed="false" aria-controls="motion-2">思考者</button>
          <button type="button" aria-pressed="false" aria-controls="motion-3">卢浮宫</button>
          <button type="button" aria-pressed="false" aria-controls="motion-4">凯旋门</button>
          <button type="button" aria-pressed="false" aria-controls="motion-5">诺曼底大桥</button>
          <button type="button" aria-pressed="false" aria-controls="motion-6">埃菲尔铁塔</button>
          <button type="button" aria-pressed="false" aria-controls="motion-7">塞纳河</button>
          <button type="button" aria-pressed="false" aria-controls="motion-8">蒙娜丽莎</button>
        </div>
        <button type="button" class="motion-toggle" hidden>播放动态</button>
      </div>
      <div class="motion-frame" id="motion-1" style="--aspect: 0.50000">
        <video width="750" height="1500" poster="assets/images/v001-poster.webp" data-src="assets/videos/v001.mp4" preload="none" playsinline muted loop aria-label="大卫"></video>
      </div>
      <div class="motion-frame" id="motion-2" style="--aspect: 0.50000" hidden>
        <video width="600" height="1200" data-poster="assets/images/v005-poster.webp" data-src="assets/videos/v005.mp4" preload="none" playsinline muted loop aria-label="思考者"></video>
      </div>
      <div class="motion-frame" id="motion-3" style="--aspect: 0.50000" hidden>
        <video width="600" height="1200" data-poster="assets/images/v002-poster.webp" data-src="assets/videos/v002.mp4" preload="none" playsinline muted loop aria-label="卢浮宫"></video>
      </div>
      <div class="motion-frame" id="motion-4" style="--aspect: 0.50000" hidden>
        <video width="750" height="1500" data-poster="assets/images/v008-poster.webp" data-src="assets/videos/v008.mp4" preload="none" playsinline muted loop aria-label="凯旋门"></video>
      </div>
      <div class="motion-frame" id="motion-5" style="--aspect: 0.50000" hidden>
        <video width="750" height="1500" data-poster="assets/images/v006-poster.webp" data-src="assets/videos/v006.mp4" preload="none" playsinline muted loop aria-label="诺曼底大桥"></video>
      </div>
      <div class="motion-frame" id="motion-6" style="--aspect: 0.50000" hidden>
        <video width="600" height="1200" data-poster="assets/images/v007-poster.webp" data-src="assets/videos/v007.mp4" preload="none" playsinline muted loop aria-label="埃菲尔铁塔"></video>
      </div>
      <div class="motion-frame" id="motion-7" style="--aspect: 0.50083" hidden>
        <video width="600" height="1198" data-poster="assets/images/v004-poster.webp" data-src="assets/videos/v004.mp4" preload="none" playsinline muted loop aria-label="塞纳河"></video>
      </div>
      <div class="motion-frame" id="motion-8" style="--aspect: 0.50000" hidden>
        <video width="600" height="1200" data-poster="assets/images/v003-poster.webp" data-src="assets/videos/v003.mp4" preload="none" playsinline muted loop aria-label="蒙娜丽莎"></video>
      </div>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>结合巴黎奥运会，为夏日清凉商品制作系列海报和动效。</dd></div>
      <div><dt>创意点</dt><dd>让雕塑与地标从原有材质变成冰。大卫、卢浮宫等八个画面沿用同一套海报版式。</dd></div>
    </dl>
    <section class="case-section">
      <h2>材质对照</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/60282fdcaba3f6.webp" data-label="雕塑造型" aria-label="放大：雕塑造型">
            <img src="assets/images/60282fdcaba3f6.webp" alt="雕塑造型" width="1126" height="1630" loading="lazy" decoding="async">
          </button>
          <figcaption>雕塑造型</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/c9deaac1a5293a.webp" data-label="冰感造型" aria-label="放大：冰感造型">
            <img src="assets/images/c9deaac1a5293a.webp" alt="冰感造型" width="1070" height="1604" loading="lazy" decoding="async">
          </button>
          <figcaption>冰感造型</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>
</body>
</html>
