<!doctype html>
<html lang="zh-CN" style="--bg: #210f3a; --fg: #f8f4ff; --muted: #c7b9db; --accent: #d4ff39">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#210f3a">
  <meta name="description" content="天猫千星计划为运动户外品牌闭门会制作电子邀请函。用四角星串起骑行、游泳、跑步和登山，尾页翻出时间与地点。">
  <title>户外新势力 · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>户外新势力</h1>
      <p>天猫千星计划 · 2025</p>
    </header>
    <section id="motion" class="case-media case-motion" aria-label="项目动态">
      <div class="motion-controls">
        <div class="motion-picker" role="group" aria-label="选择动态">
          <button type="button" aria-pressed="true" aria-controls="motion-1">完整邀请函</button>
          <button type="button" aria-pressed="false" aria-controls="motion-2">尾页翻转</button>
          <button type="button" aria-pressed="false" aria-controls="motion-3">跑步动作测试</button>
          <button type="button" aria-pressed="false" aria-controls="motion-4">游泳动作测试</button>
          <button type="button" aria-pressed="false" aria-controls="motion-5">登山动作测试</button>
        </div>
        <button type="button" class="motion-toggle" hidden>播放动态</button>
      </div>
      <div class="motion-frame" id="motion-1" style="--aspect: 0.57181">
        <video width="1728" height="3022" poster="assets/images/v031-poster.webp" data-src="assets/videos/v031.mp4" preload="none" playsinline muted loop aria-label="完整邀请函"></video>
      </div>
      <div class="motion-frame" id="motion-2" style="--aspect: 0.57181" hidden>
        <video width="1728" height="3022" data-poster="assets/images/v026-poster.webp" data-src="assets/videos/v026.mp4" preload="none" playsinline muted loop aria-label="尾页翻转"></video>
      </div>
      <div class="motion-frame" id="motion-3" style="--aspect: 0.88235" hidden>
        <video width="900" height="1020" data-poster="assets/images/v022-poster.webp" data-src="assets/videos/v022.mp4" preload="none" playsinline muted loop aria-label="跑步动作测试"></video>
      </div>
      <div class="motion-frame" id="motion-4" style="--aspect: 0.84375" hidden>
        <video width="864" height="1024" data-poster="assets/images/v023-poster.webp" data-src="assets/videos/v023.mp4" preload="none" playsinline muted loop aria-label="游泳动作测试"></video>
      </div>
      <div class="motion-frame" id="motion-5" style="--aspect: 0.69686" hidden>
        <video width="800" height="1148" data-poster="assets/images/v025-poster.webp" data-src="assets/videos/v025.mp4" preload="none" playsinline muted loop aria-label="登山动作测试"></video>
      </div>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>天猫千星计划为运动户外品牌闭门会制作电子邀请函。</dd></div>
      <div><dt>创意点</dt><dd>用四角星串起骑行、游泳、跑步和登山，尾页翻出时间与地点。</dd></div>
    </dl>
    <section class="case-section" id="series">
      <h2>系列邀请页</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/3fe8fbb72b5767.webp" data-label="骑行" aria-label="放大：骑行">
            <img src="assets/images/3fe8fbb72b5767.webp" alt="骑行" width="1728" height="3022" loading="lazy" decoding="async">
          </button>
          <figcaption>骑行</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/fc0062d8481cbf.webp" data-label="游泳" aria-label="放大：游泳">
            <img src="assets/images/fc0062d8481cbf.webp" alt="游泳" width="1728" height="3022" loading="lazy" decoding="async">
          </button>
          <figcaption>游泳</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/f80cf4c22f04cd.webp" data-label="跑步" aria-label="放大：跑步">
            <img src="assets/images/f80cf4c22f04cd.webp" alt="跑步" width="1728" height="3022" loading="lazy" decoding="async">
          </button>
          <figcaption>跑步</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/4f0730b2dd1492.webp" data-label="登山" aria-label="放大：登山">
            <img src="assets/images/4f0730b2dd1492.webp" alt="登山" width="1728" height="3022" loading="lazy" decoding="async">
          </button>
          <figcaption>登山</figcaption>
        </figure>
      </div>
    </section>
    <section class="case-section" id="visual">
      <h2>千星图形</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art">
          <button class="artwork" type="button" data-zoom="assets/images/8bfe35b04df22f.webp" data-label="图形延展" aria-label="放大：图形延展">
            <img src="assets/images/8bfe35b04df22f.webp" alt="图形延展" width="2200" height="1238" loading="lazy" decoding="async">
          </button>
          <figcaption>图形延展</figcaption>
        </figure>
        <figure class="case-art">
          <button class="artwork" type="button" data-zoom="assets/images/3e21e6948695a9.webp" data-label="标志与配色" aria-label="放大：标志与配色">
            <img src="assets/images/3e21e6948695a9.webp" alt="标志与配色" width="2200" height="1238" loading="lazy" decoding="async">
          </button>
          <figcaption>标志与配色</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>
</body>
</html>
