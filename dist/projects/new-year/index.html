  <script>
(() => {
  const hero = document.querySelector('.hero-motion');
  const video = document.getElementById('hero-video');
  const surface = document.getElementById('hero-surface');
  if (!hero || !video || !surface) return;

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let inView = true;
  let drawFrame;
  let scheduled = false;
  video.muted = true;
  video.defaultMuted = true;

  // The supplied 4:3 video is aligned by its artwork bounds, with transparent
  // green-screen pixels. The surrounding AI artboard keeps its original size.
  const gl = surface.getContext('webgl', {
    alpha: true, premultipliedAlpha: true, antialias: false,
    preserveDrawingBuffer: false, powerPreference: 'low-power'
  });
  if (gl) {
    try {
      const shader = (type, source) => {
        const result = gl.createShader(type);
        gl.shaderSource(result, source);
        gl.compileShader(result);
        if (!gl.getShaderParameter(result, gl.COMPILE_STATUS)) throw Error('shader');
        return result;
      };
      const vertex = shader(gl.VERTEX_SHADER, `
        attribute vec2 position;
        varying vec2 uv;
        void main() {
          uv = vec2((position.x + 1.0) * 0.5, (1.0 - position.y) * 0.5);
          gl_Position = vec4(position, 0.0, 1.0);
        }
      `);
      const fragment = shader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        uniform sampler2D frame;
        varying vec2 uv;
        void main() {
          vec3 color = texture2D(frame, uv).rgb;
          float green = color.g - max(color.r, color.b);
          float relative = green / max(color.g, 0.001);
          float alpha = 1.0 - max(smoothstep(0.14, 0.30, green), smoothstep(0.55, 0.80, relative));
          color.g = max(0.0, color.g - max(green, 0.0) * (0.22 + 0.78 * (1.0 - alpha)));
          gl_FragColor = vec4(color * alpha, alpha);
        }
      `);
      const program = gl.createProgram();
      gl.attachShader(program, vertex);
      gl.attachShader(program, fragment);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw Error('program');
      gl.useProgram(program);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const position = gl.getAttribLocation(program, 'position');
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      const texture = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.uniform1i(gl.getUniformLocation(program, 'frame'), 0);
      gl.viewport(0, 0, surface.width, surface.height);
      drawFrame = () => {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      };
      surface.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        drawFrame = null;
        hero.classList.remove('is-playing');
        video.pause();
      });
    } catch {
      video.pause();
      return;
    }
  } else {
    // Software fallback for browsers with GPU rendering disabled.
    surface.width = 960;
    surface.height = 720;
    const context = surface.getContext('2d', { willReadFrequently: true });
    if (!context) { video.pause(); return; }
    const smooth = (a, b, value) => {
      const t = Math.max(0, Math.min(1, (value - a) / (b - a)));
      return t * t * (3 - 2 * t);
    };
    drawFrame = () => {
      context.drawImage(video, 0, 0, surface.width, surface.height);
      const frame = context.getImageData(0, 0, surface.width, surface.height);
      const pixels = frame.data;
      for (let i = 0; i < pixels.length; i += 4) {
        const green = (pixels[i + 1] - Math.max(pixels[i], pixels[i + 2])) / 255;
        const relative = green / Math.max(pixels[i + 1] / 255, .001);
        const alpha = 1 - Math.max(smooth(.14, .30, green), smooth(.55, .80, relative));
        pixels[i + 1] = Math.max(0, pixels[i + 1] - Math.max(green, 0) * (.22 + .78 * (1 - alpha)) * 255);
        pixels[i + 3] = Math.round(alpha * 255);
      }
      context.putImageData(frame, 0, 0);
    };

    scheduled = false;
    if (!drawFrame || video.paused || document.hidden || !inView || reducedMotion.matches) return;
    if (video.readyState >= 2) {
      try { drawFrame(); hero.classList.add('is-playing'); }
      catch { video.pause(); hero.classList.remove('is-playing'); return; }
    }
    schedule();
  };
  const schedule = () => {
    if (scheduled) return;
    scheduled = true;
    if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(tick);
    else requestAnimationFrame(tick);
  };
  const syncPlayback = () => {
    if (document.hidden || !inView || reducedMotion.matches || !drawFrame) {
      video.pause();
      if (reducedMotion.matches) hero.classList.remove('is-playing');
    } else video.play().then(schedule).catch(() => {});
  };
  video.addEventListener('playing', schedule);
  video.addEventListener('loadeddata', syncPlayback);
  video.addEventListener('error', () => hero.classList.remove('is-playing'));
  document.addEventListener('visibilitychange', syncPlayback);
  reducedMotion.addEventListener('change', syncPlayback);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(entries => {
      inView = entries[0].isIntersecting;
      syncPlayback();
    }).observe(hero);
  }
  // Retry muted autoplay after a touch when the device initially blocks it.
  document.addEventListener('pointerdown', syncPlayback, { once: true });
  syncPlayback();
})();

</script>
  <script>
    const pieces = [...document.querySelectorAll('.piece')];
    const dialog = document.getElementById('viewer');
    const stage = document.getElementById('viewer-stage');
    const canvas = document.getElementById('viewer-canvas');
    const image = document.getElementById('viewer-image');
    const title = document.getElementById('viewer-title');
    const count = document.getElementById('viewer-count');
    const zoomValue = document.getElementById('zoom-value');
    let current = 0, zoom = 1, fit = 1, lastFocus = null;

    function sizeImage() {
      if (!image.naturalWidth || !image.naturalHeight) return;
      const width = Math.round(image.naturalWidth * fit * zoom);
      const height = Math.round(image.naturalHeight * fit * zoom);
      image.style.width = width + 'px';
      canvas.style.width = Math.max(stage.clientWidth, width) + 'px';
      canvas.style.height = Math.max(stage.clientHeight, height) + 'px';
      zoomValue.textContent = Math.round(zoom * 100) + '%';
      stage.scrollLeft = Math.max(0, (canvas.clientWidth - stage.clientWidth) / 2);
      stage.scrollTop = Math.max(0, (canvas.clientHeight - stage.clientHeight) / 2);
    }
    function show(index) {
      current = (index + pieces.length) % pieces.length;
      const piece = pieces[current];
      title.textContent = piece.dataset.label;
      count.textContent = (current + 1) + ' / ' + pieces.length;
      image.alt = piece.dataset.label;
      image.onload = () => {
        fit = Math.min(stage.clientWidth / image.naturalWidth, stage.clientHeight / image.naturalHeight, 1);
        zoom = 1;
        sizeImage();
      };
      image.src = piece.dataset.detail;
    }
    function changeZoom(factor) { zoom = Math.max(1, Math.min(5, zoom * factor)); sizeImage(); }
    pieces.forEach((piece,index) => piece.addEventListener('click', () => {
      lastFocus = document.activeElement;
      dialog.showModal();
      show(index);
    }));
    document.getElementById('previous').addEventListener('click', () => show(current-1));
    document.getElementById('next').addEventListener('click', () => show(current+1));
    document.getElementById('zoom-in').addEventListener('click', () => changeZoom(1.5));
    document.getElementById('zoom-out').addEventListener('click', () => changeZoom(1/1.5));
    document.getElementById('close-viewer').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => { image.removeAttribute('src'); lastFocus?.focus(); });
    dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });
    dialog.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); show(current+1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(current-1); }
      if (e.key === '+' || e.key === '=') { e.preventDefault(); changeZoom(1.5); }
      if (e.key === '-') { e.preventDefault(); changeZoom(1/1.5); }
    });
    window.addEventListener('resize', () => {
      if (dialog.open && image.naturalWidth) {
        fit = Math.min(stage.clientWidth / image.naturalWidth, stage.clientHeight / image.naturalHeight, 1);
        sizeImage();
      }
    });
    const stats = [...document.querySelectorAll('.stat')];
    if (stats.length && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      stats.forEach(stat => stat.classList.add('pending'));
      const runCount = stat => {
        if (stat.dataset.started) return;
        stat.dataset.started = 'true';
        const target = Number(stat.dataset.target);
        const value = stat.querySelector('.stat-value');
        const begin = performance.now();
        const duration = 1600;
        const frame = now => {
          const t = Math.min(1, (now - begin) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          value.textContent = String(Math.round(target * eased));
          if (t < 1) requestAnimationFrame(frame);
          else { value.textContent = String(target); stat.classList.add('done'); stat.classList.remove('pending'); }
        };
        requestAnimationFrame(frame);
      };
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => { if (entry.isIntersecting) { runCount(entry.target); observer.unobserve(entry.target); } });
        }, { threshold: .35 });
        stats.forEach(stat => observer.observe(stat));
      } else stats.forEach(runCount);
    }
  </script>
