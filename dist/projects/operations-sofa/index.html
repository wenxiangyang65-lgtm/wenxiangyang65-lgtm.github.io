<!doctype html>
<html lang="zh-CN" style="--bg: #e7dfd1; --fg: #463b2e; --muted: #605346; --accent: #7b5630">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e7dfd1">
  <meta name="description" content="家享生活开学季沙发节，为四款沙发制作系列插画海报。让插画人物躺、靠、倒挂，把沙发的坐感画出来。四款沿用同一句手写标题，各有一套配色。">
  <title>沙发节 · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>沙发节</h1>
      <p>天猫家享生活 · 2024</p>
    </header>
    <section id="motion" class="case-media case-motion" aria-label="项目动态">
      <div class="motion-controls">
        <p class="single-caption">四色沙发动态</p>
        <button type="button" class="motion-toggle" hidden>播放动态</button>
      </div>
      <div class="motion-frame" id="motion-1" style="--aspect: 0.75000">
        <video width="900" height="1200" poster="assets/images/v021-poster.webp" data-src="assets/videos/sofa-series.mp4" preload="none" playsinline muted loop aria-label="四色沙发动态"></video>
      </div>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>家享生活开学季沙发节，为四款沙发制作系列插画海报。</dd></div>
      <div><dt>创意点</dt><dd>让插画人物躺、靠、倒挂，把沙发的坐感画出来。四款沿用同一句手写标题，各有一套配色。</dd></div>
    </dl>
    <section class="case-section" id="posters">
      <h2>四色系列海报</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/73ba9b3b21b293.webp" data-label="姜黄" aria-label="放大：姜黄">
            <img src="assets/images/73ba9b3b21b293.webp" alt="姜黄" width="1080" height="1921" loading="lazy" decoding="async">
          </button>
          <figcaption>姜黄</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/b4121ce47cac36.webp" data-label="绿色" aria-label="放大：绿色">
            <img src="assets/images/b4121ce47cac36.webp" alt="绿色" width="1080" height="1921" loading="lazy" decoding="async">
          </button>
          <figcaption>绿色</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/2110005017c65b.webp" data-label="卡其" aria-label="放大：卡其">
            <img src="assets/images/2110005017c65b.webp" alt="卡其" width="1080" height="1921" loading="lazy" decoding="async">
          </button>
          <figcaption>卡其</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/e3f63dee263fb6.webp" data-label="朱红" aria-label="放大：朱红">
            <img src="assets/images/e3f63dee263fb6.webp" alt="朱红" width="1080" height="1920" loading="lazy" decoding="async">
          </button>
          <figcaption>朱红</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>
</body>
</html>
