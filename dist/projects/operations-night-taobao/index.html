<!doctype html>
<html lang="zh-CN" style="--bg: #0c0d12; --fg: #f5f0ee; --muted: #b4abb5; --accent: #ffb467">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c0d12">
  <meta name="description" content="夜淘宝上线时，以夜间娱乐与生活内容为主题制作活动主视觉。根据前期草图搭建一座微缩夜市，用烧烤摊、放映厅和霓虹招牌表现夜间场景。负责三维建模与渲染。">
  <title>夜淘宝 · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>夜淘宝</h1>
      <p>淘宝 · 2023</p>
    </header>
    <section class="case-media case-cover" aria-label="主视觉">
      <figure class="case-art">
        <button class="artwork" type="button" data-zoom="assets/images/13e0e092ff54ab.webp" data-label="夜市主视觉" aria-label="放大：夜市主视觉">
          <img src="assets/images/13e0e092ff54ab.webp" alt="夜市主视觉" width="1920" height="1790" loading="eager" decoding="async">
        </button>
        <figcaption>夜市主视觉</figcaption>
      </figure>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>夜淘宝上线时，以夜间娱乐与生活内容为主题制作活动主视觉。</dd></div>
      <div><dt>创意点</dt><dd>根据前期草图搭建一座微缩夜市，用烧烤摊、放映厅和霓虹招牌表现夜间场景。负责三维建模与渲染。</dd></div>
    </dl>
    <section class="case-section">
      <h2>制作与应用</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art">
          <button class="artwork" type="button" data-zoom="assets/images/47235fd0aaa854.webp" data-label="街区白模" aria-label="放大：街区白模">
            <img src="assets/images/47235fd0aaa854.webp" alt="街区白模" width="1920" height="1790" loading="lazy" decoding="async">
          </button>
          <figcaption>街区白模</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/c13f07d68ac246.webp" data-label="手机端页面" aria-label="放大：手机端页面">
            <img src="assets/images/c13f07d68ac246.webp" alt="手机端页面" width="1080" height="2340" loading="lazy" decoding="async">
          </button>
          <figcaption>手机端页面</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>
</body>
</html>
