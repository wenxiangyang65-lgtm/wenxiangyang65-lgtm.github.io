<!doctype html>
<html lang="zh-CN" style="--bg: #12352a; --fg: #f2f5eb; --muted: #b7d2be; --accent: #bcec64">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12352a">
  <meta name="description" content="2024 欧洲杯期间，为客厅观赛相关商品制作活动主视觉。把沙发、电视和球场放在同一场景。我在前期方案基础上深化构图，合成球员、商品与客厅。">
  <title>足球惠客厅 · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>足球惠客厅</h1>
      <p>欧洲杯观赛营销 · 2024</p>
    </header>
    <section class="case-media case-cover" aria-label="主视觉">
      <figure class="case-art portrait">
        <button class="artwork" type="button" data-zoom="assets/images/c4202faaacbb5b.webp" data-label="活动主视觉" aria-label="放大：活动主视觉">
          <img src="assets/images/c4202faaacbb5b.webp" alt="活动主视觉" width="1645" height="3200" loading="eager" decoding="async">
        </button>
        <figcaption>活动主视觉</figcaption>
      </figure>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>2024 欧洲杯期间，为客厅观赛相关商品制作活动主视觉。</dd></div>
      <div><dt>创意点</dt><dd>把沙发、电视和球场放在同一场景。我在前期方案基础上深化构图，合成球员、商品与客厅。</dd></div>
    </dl>
    <section class="case-section">
      <h2>构图与场景</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/2f084e4c2a04ec.webp" data-label="前期构图参考" aria-label="放大：前期构图参考">
            <img src="assets/images/2f084e4c2a04ec.webp" alt="前期构图参考" width="808" height="1448" loading="lazy" decoding="async">
          </button>
          <figcaption>前期构图参考</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/12e1e807880883.webp" data-label="场景合成" aria-label="放大：场景合成">
            <img src="assets/images/12e1e807880883.webp" alt="场景合成" width="896" height="1576" loading="lazy" decoding="async">
          </button>
          <figcaption>场景合成</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>
</body>
</html>
