<!doctype html>
<html lang="zh-CN" style="--bg: #e9edf1; --fg: #28323e; --muted: #4d5e70; --accent: #445f7a">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e9edf1">
  <meta name="description" content="面向准备入驻的商家，介绍开店激励与入驻方式。把天猫轮廓做成一间会开门的店铺，页面把权益和入驻入口放在主视觉旁。">
  <title>天猫招商 · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>天猫招商</h1>
      <p>天猫 · 2025</p>
    </header>
    <section id="motion" class="case-media case-motion" aria-label="项目动态">
      <div class="motion-controls">
        <div class="motion-picker" role="group" aria-label="选择动态">
          <button type="button" aria-pressed="true" aria-controls="motion-1">招商页面动态</button>
          <button type="button" aria-pressed="false" aria-controls="motion-2">店铺开门测试</button>
          <button type="button" aria-pressed="false" aria-controls="motion-3">品牌 IP 动作测试</button>
        </div>
        <button type="button" class="motion-toggle" hidden>播放动态</button>
      </div>
      <div class="motion-frame" id="motion-1" style="--aspect: 3.29489">
        <video width="4000" height="1214" poster="assets/images/v043-poster.webp" data-src="assets/videos/v043.mp4" preload="none" playsinline muted loop aria-label="招商页面动态"></video>
      </div>
      <div class="motion-frame" id="motion-2" style="--aspect: 1.77778" hidden>
        <video width="1920" height="1080" data-poster="assets/images/v027-poster.webp" data-src="assets/videos/v027.mp4" preload="none" playsinline muted loop aria-label="店铺开门测试"></video>
      </div>
      <div class="motion-frame" id="motion-3" style="--aspect: 1.34615" hidden>
        <video width="1120" height="832" data-poster="assets/images/v030-poster.webp" data-src="assets/videos/v030.mp4" preload="none" playsinline muted loop aria-label="品牌 IP 动作测试"></video>
      </div>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>面向准备入驻的商家，介绍开店激励与入驻方式。</dd></div>
      <div><dt>创意点</dt><dd>把天猫轮廓做成一间会开门的店铺，页面把权益和入驻入口放在主视觉旁。</dd></div>
    </dl>
    <section class="case-section">
      <h2>店铺造型</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art">
          <button class="artwork" type="button" data-zoom="assets/images/6904f4760244a0.webp" data-label="闭合" aria-label="放大：闭合">
            <img src="assets/images/6904f4760244a0.webp" alt="闭合" width="2200" height="1238" loading="lazy" decoding="async">
          </button>
          <figcaption>闭合</figcaption>
        </figure>
        <figure class="case-art">
          <button class="artwork" type="button" data-zoom="assets/images/21fd639c1cb224.webp" data-label="开启" aria-label="放大：开启">
            <img src="assets/images/21fd639c1cb224.webp" alt="开启" width="2200" height="1238" loading="lazy" decoding="async">
          </button>
          <figcaption>开启</figcaption>
        </figure>
      </div>
    </section>
    <section class="case-section">
      <h2>页面延展</h2>
      <div class="case-grid case-grid-single" style="--columns: 1">
        <figure class="case-art">
          <button class="artwork" type="button" data-zoom="assets/images/9ec9b7344e0dda.webp" data-label="桌面端搜索结果" aria-label="放大：桌面端搜索结果">
            <img src="assets/images/9ec9b7344e0dda.webp" alt="桌面端搜索结果" width="2200" height="528" loading="lazy" decoding="async">
          </button>
          <figcaption>桌面端搜索结果</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/e14368dd04d93f.webp" data-label="手机端页面" aria-label="放大：手机端页面">
            <img src="assets/images/e14368dd04d93f.webp" alt="手机端页面" width="1179" height="2556" loading="lazy" decoding="async">
          </button>
          <figcaption>手机端页面</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>
</body>
</html>
