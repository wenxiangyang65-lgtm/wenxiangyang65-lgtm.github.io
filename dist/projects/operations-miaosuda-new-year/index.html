<!doctype html>
<html lang="zh-CN" style="--bg: #55141d; --fg: #f8ecdb; --muted: #e5c3b3; --accent: #edc99d">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#55141d">
  <meta name="description" content="为喵速达年货节制作相机、游戏机和冰箱三款海报。相机对应年夜饭留影，游戏机对应团圆夜，冰箱对应过年备货。三张画面沿用同一角色和春节配色。">
  <title>年货节海报插画 · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>年货节海报插画</h1>
      <p>喵速达 · 2024</p>
    </header>
    <section class="case-media case-cover" aria-label="主视觉">
      <figure class="case-art portrait">
        <button class="artwork" type="button" data-zoom="assets/images/ac496dcc5f824d.webp" data-label="相机 · 新年记录" aria-label="放大：相机 · 新年记录">
          <img src="assets/images/ac496dcc5f824d.webp" alt="相机 · 新年记录" width="1770" height="3149" loading="eager" decoding="async">
        </button>
        <figcaption>相机 · 新年记录</figcaption>
      </figure>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>为喵速达年货节制作相机、游戏机和冰箱三款海报。</dd></div>
      <div><dt>创意点</dt><dd>相机对应年夜饭留影，游戏机对应团圆夜，冰箱对应过年备货。三张画面沿用同一角色和春节配色。</dd></div>
    </dl>
    <section class="case-section">
      <h2>系列海报</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/45a7fc29d8a088.webp" data-label="游戏机 · 团聚时刻" aria-label="放大：游戏机 · 团聚时刻">
            <img src="assets/images/45a7fc29d8a088.webp" alt="游戏机 · 团聚时刻" width="1770" height="3149" loading="lazy" decoding="async">
          </button>
          <figcaption>游戏机 · 团聚时刻</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/1b6d98e3337a85.webp" data-label="冰箱 · 年货生活" aria-label="放大：冰箱 · 年货生活">
            <img src="assets/images/1b6d98e3337a85.webp" alt="冰箱 · 年货生活" width="1770" height="3149" loading="lazy" decoding="async">
          </button>
          <figcaption>冰箱 · 年货生活</figcaption>
        </figure>
      </div>
    </section>
    <section class="case-section">
      <h2>构图与造型</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/849652718ad3f4.webp" data-label="相机款构图草图" aria-label="放大：相机款构图草图">
            <img src="assets/images/849652718ad3f4.webp" alt="相机款构图草图" width="1080" height="1921" loading="lazy" decoding="async">
          </button>
          <figcaption>相机款构图草图</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/4743bfb00656eb.webp" data-label="相机款三维探索" aria-label="放大：相机款三维探索">
            <img src="assets/images/4743bfb00656eb.webp" alt="相机款三维探索" width="1880" height="3200" loading="lazy" decoding="async">
          </button>
          <figcaption>相机款三维探索</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>
</body>
</html>
