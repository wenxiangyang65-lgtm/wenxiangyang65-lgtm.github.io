<!doctype html>
<html lang="zh-CN" style="--bg: #eee8df; --fg: #493e32; --muted: #665844; --accent: #765b35">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eee8df">
  <meta name="description" content="春季家装活动，把家装、家居和家电商品按风格搭配成组。做六款不同风格的生活场景海报，每张画面同时展示搭配效果和对应商品。">
  <title>春日美家磕 CP · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>春日美家磕 CP</h1>
      <p>家装营销 · 2024</p>
    </header>
    <section class="case-media case-cover" aria-label="主视觉">
      <figure class="case-art portrait">
        <button class="artwork" type="button" data-zoom="assets/images/4c24f5e5ace28e.webp" data-label="纯净精养" aria-label="放大：纯净精养">
          <img src="assets/images/4c24f5e5ace28e.webp" alt="纯净精养" width="1994" height="3200" loading="eager" decoding="async">
        </button>
        <figcaption>纯净精养</figcaption>
      </figure>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>春季家装活动，把家装、家居和家电商品按风格搭配成组。</dd></div>
      <div><dt>创意点</dt><dd>做六款不同风格的生活场景海报，每张画面同时展示搭配效果和对应商品。</dd></div>
    </dl>
    <section class="case-section">
      <h2>系列场景海报</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/52fc091af1a52e.webp" data-label="中式美学" aria-label="放大：中式美学">
            <img src="assets/images/52fc091af1a52e.webp" alt="中式美学" width="1994" height="3200" loading="lazy" decoding="async">
          </button>
          <figcaption>中式美学</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/1fe6638b7da885.webp" data-label="匠心工艺" aria-label="放大：匠心工艺">
            <img src="assets/images/1fe6638b7da885.webp" alt="匠心工艺" width="1994" height="3200" loading="lazy" decoding="async">
          </button>
          <figcaption>匠心工艺</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/07df314bff3ae6.webp" data-label="五感疗愈" aria-label="放大：五感疗愈">
            <img src="assets/images/07df314bff3ae6.webp" alt="五感疗愈" width="1994" height="3200" loading="lazy" decoding="async">
          </button>
          <figcaption>五感疗愈</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/f43c78f1402952.webp" data-label="创趣玩家" aria-label="放大：创趣玩家">

          </button>
          <figcaption>创趣玩家</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/07334a7a89ce24.webp" data-label="先锋智享" aria-label="放大：先锋智享">
            <img src="assets/images/07334a7a89ce24.webp" alt="先锋智享" width="1994" height="3200" loading="lazy" decoding="async">
          </button>
          <figcaption>先锋智享</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>

</html>
