<!doctype html>
<html lang="zh-CN" style="--bg: #e6eaee; --fg: #202b35; --muted: #465766; --accent: #315f6d">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e6eaee">
  <meta name="description" content="天猫汽车用月刊推荐当期新车，系列覆盖汽车和摩托车。固定刊头、期数和活动日期。每款车换一套场景，动效突出车身和车型。">
  <title>超新月刊 · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>超新月刊</h1>
      <p>天猫汽车 · 2025</p>
    </header>
    <section id="motion" class="case-media case-motion" aria-label="项目动态">
      <div class="motion-controls">
        <div class="motion-picker" role="group" aria-label="选择动态">
          <button type="button" aria-pressed="true" aria-controls="motion-1">奇瑞多米</button>
          <button type="button" aria-pressed="false" aria-controls="motion-2">沃尔沃 S90</button>
          <button type="button" aria-pressed="false" aria-controls="motion-3">BMW R 1300 GS</button>
        </div>
        <button type="button" class="motion-toggle" hidden>播放动态</button>
      </div>
      <div class="motion-frame" id="motion-1" style="--aspect: 0.56250">
        <video width="1080" height="1920" poster="assets/images/v042-poster.webp" data-src="assets/videos/v042.mp4" preload="none" playsinline muted loop aria-label="奇瑞多米"></video>
      </div>
      <div class="motion-frame" id="motion-2" style="--aspect: 0.56250" hidden>
        <video width="1080" height="1920" data-poster="assets/images/v041-poster.webp" data-src="assets/videos/v041.mp4" preload="none" playsinline muted loop aria-label="沃尔沃 S90"></video>
      </div>
      <div class="motion-frame" id="motion-3" style="--aspect: 0.56250" hidden>
        <video width="1080" height="1920" data-poster="assets/images/v040-poster.webp" data-src="assets/videos/v040.mp4" preload="none" playsinline muted loop aria-label="BMW R 1300 GS"></video>
      </div>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>天猫汽车用月刊推荐当期新车，系列覆盖汽车和摩托车。</dd></div>
      <div><dt>创意点</dt><dd>固定刊头、期数和活动日期。每款车换一套场景，动效突出车身和车型。</dd></div>
    </dl>
    <section class="case-section">
      <h2>版式与场景</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/0e9576dd278259.webp" data-label="栏目字形与场景配色" aria-label="放大：栏目字形与场景配色">
            <img src="assets/images/0e9576dd278259.webp" alt="栏目字形与场景配色" width="808" height="1412" loading="lazy" decoding="async">
          </button>
          <figcaption>栏目字形与场景配色</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/d2e027d53dbc06.webp" data-label="摩托车动态素材" aria-label="放大：摩托车动态素材">
            <img src="assets/images/d2e027d53dbc06.webp" alt="摩托车动态素材" width="808" height="1412" loading="lazy" decoding="async">
          </button>
          <figcaption>摩托车动态素材</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>
</body>
</html>
