<!doctype html>
<html lang="zh-CN" style="--bg: #151b1b; --fg: #f2f6f5; --muted: #a9bcba; --accent: #a4ccc2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151b1b">
  <meta name="description" content="为天猫双 11 主会场及分会场设计多品牌商品视觉。把商品组合成一座城市里的建筑，再用不同建筑区分三类会场。">
  <title>全民种草 · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>全民种草</h1>
      <p>天猫双 11 · 2023</p>
    </header>
    <section class="case-media case-cover" aria-label="主视觉">
      <figure class="case-art">
        <button class="artwork" type="button" data-zoom="assets/images/e7f9fdf3405b3b.webp" data-label="主会场 · 城市全景" aria-label="放大：主会场 · 城市全景">
          <img src="assets/images/e7f9fdf3405b3b.webp" alt="主会场 · 城市全景" width="2200" height="1119" loading="eager" decoding="async">
        </button>
        <figcaption>主会场 · 城市全景</figcaption>
      </figure>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>为天猫双 11 主会场及分会场设计多品牌商品视觉。</dd></div>
      <div><dt>创意点</dt><dd>把商品组合成一座城市里的建筑，再用不同建筑区分三类会场。</dd></div>
    </dl>
    <section class="case-section">
      <h2>分会场</h2>
      <div class="case-grid" style="--columns: 3">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/3a63d3ae7b1c73.webp" data-label="年度好物" aria-label="放大：年度好物">
            <img src="assets/images/3a63d3ae7b1c73.webp" alt="年度好物" width="1125" height="2436" loading="lazy" decoding="async">
          </button>
          <figcaption>年度好物</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/ddeaccadf94912.webp" data-label="运动生态" aria-label="放大：运动生态">
            <img src="assets/images/ddeaccadf94912.webp" alt="运动生态" width="1125" height="2436" loading="lazy" decoding="async">
          </button>
          <figcaption>运动生态</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/images/1acb5dd19ce31f.webp" data-label="年终钜惠" aria-label="放大：年终钜惠">
            <img src="assets/images/1acb5dd19ce31f.webp" alt="年终钜惠" width="1125" height="2436" loading="lazy" decoding="async">
          </button>
          <figcaption>年终钜惠</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>
</body>
</html>
