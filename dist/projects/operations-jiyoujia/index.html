<!doctype html>
<html lang="zh-CN" style="--bg: #080808; --fg: #f1f1ee; --muted: #bdbdb7; --accent: #ffe800">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="极有家与飞猪把家居展带进民宿，展示不同风格的家居搭配。用黄色房屋轮廓串起四类民宿。地图用来找场景，商品清单和挂牌用来找同款。">
  <title>极有家 · 不在家腔调家居展 · 运营视觉</title>
  <link rel="stylesheet" href="../../operations-case.css">
  <script src="../../operations-case.js" defer></script>
  <script src="../../project-navigation.js" defer></script>
  <script src="../../desktop-preview.js" defer></script>
</head>
<body>
  <main class="case-page">
    <header class="case-header">
      <h1>极有家 · 不在家腔调家居展</h1>
      <p>极有家 × 飞猪旅行 · 2024</p>
    </header>
    <section id="motion" class="case-media case-motion" aria-label="项目动态">
      <div class="motion-controls">
        <p class="single-caption">展览动态</p>
        <button type="button" class="motion-toggle" hidden>播放动态</button>
      </div>
      <div class="motion-frame" id="motion-1" style="--aspect: 0.75000">
        <video width="1080" height="1440" poster="assets/motion-0.webp" data-src="assets/jiyoujia-film.mp4" preload="none" playsinline muted loop aria-label="展览动态"></video>
      </div>
    </section>
    <dl class="case-brief" aria-label="项目简介">
      <div><dt>项目背景</dt><dd>极有家与飞猪把家居展带进民宿，展示不同风格的家居搭配。</dd></div>
      <div><dt>创意点</dt><dd>用黄色房屋轮廓串起四类民宿。地图用来找场景，商品清单和挂牌用来找同款。</dd></div>
    </dl>
    <section class="case-section" id="g3">
      <h2>系列海报</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/wild.webp" data-label="野奢" aria-label="放大：野奢">
            <img src="assets/wild.webp" alt="野奢" width="788" height="1133" loading="lazy" decoding="async">
          </button>
          <figcaption>野奢</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/country.webp" data-label="原乡" aria-label="放大：原乡">
            <img src="assets/country.webp" alt="原乡" width="788" height="1133" loading="lazy" decoding="async">
          </button>
          <figcaption>原乡</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/industry.webp" data-label="轻工业" aria-label="放大：轻工业">
            <img src="assets/industry.webp" alt="轻工业" width="788" height="1133" loading="lazy" decoding="async">
          </button>
          <figcaption>轻工业</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/dopamine.webp" data-label="INS 多巴胺" aria-label="放大：INS 多巴胺">
            <img src="assets/dopamine.webp" alt="INS 多巴胺" width="788" height="1133" loading="lazy" decoding="async">
          </button>
          <figcaption>INS 多巴胺</figcaption>
        </figure>
      </div>
    </section>
    <section class="case-section" id="g5">
      <h2>地图与清单</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/map-1.webp" data-label="民宿导览" aria-label="放大：民宿导览">
            <img src="assets/map-1.webp" alt="民宿导览" width="714" height="1666" loading="lazy" decoding="async">
          </button>
          <figcaption>民宿导览</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/map-2.webp" data-label="野奢风商品清单" aria-label="放大：野奢风商品清单">
            <img src="assets/map-2.webp" alt="野奢风商品清单" width="778" height="1666" loading="lazy" decoding="async">
          </button>
          <figcaption>野奢风商品清单</figcaption>
        </figure>
      </div>
    </section>
    <section class="case-section" id="g6">
      <h2>现场与手机端</h2>
      <div class="case-grid" style="--columns: 2">
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/motion-7.webp" data-label="商品挂牌" aria-label="放大：商品挂牌">
            <img src="assets/motion-7.webp" alt="商品挂牌" width="749" height="1000" loading="lazy" decoding="async">
          </button>
          <figcaption>商品挂牌</figcaption>
        </figure>
        <figure class="case-art portrait">
          <button class="artwork" type="button" data-zoom="assets/motion-9.webp" data-label="手机端页面" aria-label="放大：手机端页面">
            <img src="assets/motion-9.webp" alt="手机端页面" width="749" height="1000" loading="lazy" decoding="async">
          </button>
          <figcaption>手机端页面</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="art-dialog" aria-label="查看作品大图">
    <div class="dialog-toolbar">
      <span id="art-title">作品大图</span>
      <div>
        <button id="art-zoom" type="button" aria-pressed="false">放大细节</button>
        <button id="art-close" type="button" autofocus>关闭</button>
      </div>
    </div>
    <div class="dialog-stage"><img id="art-image" alt=""></div>
  </dialog>
</body>
</html>
