# Include in Nginx's http context (sites-enabled). Content hashes are assigned by the build.
map $arg_v $portfolio_code_cache {
    default "no-cache";
    "~^[0-9a-f]{16}$" "public, max-age=31536000, immutable";
}
server {
    listen 80;
    listen [::]:80;
    server_name 115.159.25.132;
    root /srv/yang-wenxiang-portfolio/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/portfolio-access.log;
    error_log /var/log/nginx/portfolio-error.log;
    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;

    location ~ /\. { deny all; }
    location ~* \.(?:html|json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control $portfolio_code_cache always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.avif$ {
        types { image/avif avif; }
        try_files $uri =404;
        expires 1d;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(?:webp|png|jpe?g|gif|svg|mp4|webm|woff2?|ttf|otf|pdf)$ {
        try_files $uri =404;
        expires 1d;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }
}
