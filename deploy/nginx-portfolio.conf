# Dedicated portfolio virtual host. Existing virtual hosts remain untouched.
server {
    listen 80;
    listen [::]:80;
    server_name 115.159.25.132;
    root /srv/yang-wenxiang-portfolio/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/portfolio-access.log;
    error_log /var/log/nginx/portfolio-error.log;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;

    location ~ /\. { deny all; }
    location ~* \.(?:html|js|css|json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(?:webp|png|jpe?g|gif|svg|mp4|webm|woff2?|ttf|otf|pdf)$ {
        try_files $uri =404;
        expires 1d;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }
}
